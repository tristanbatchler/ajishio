name: Deploy Docs and Web Demos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      # Build MkDocs documentation into site/
      - name: Build MkDocs documentation
        env:
          AJISHIO_DOCS: "1"
        run: |
          uv run mkdocs build --site-dir site

      # Build web demos
      - name: Install pygbag and ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build all demo projects for web
        run: |
          set -e
          mkdir -p $GITHUB_WORKSPACE/web-demos
          for d in $GITHUB_WORKSPACE/demo_projects/*; do
            if [ -f "$d/main.py" ]; then
              proj=$(basename "$d")
              echo "Building $proj..."
              uv run pygbag_export.py "$d" --build || true
              # Copy build output if exists
              if [ -d "$d/build/web" ]; then
                mkdir -p "$GITHUB_WORKSPACE/web-demos/$proj"
                cp -r "$d/build/web"/* "$GITHUB_WORKSPACE/web-demos/$proj/"
              elif [ -d "$d/_web_build/build/web" ]; then
                mkdir -p "$GITHUB_WORKSPACE/web-demos/$proj"
                cp -r "$d/_web_build/build/web"/* "$GITHUB_WORKSPACE/web-demos/$proj/"
              fi
            fi
          done

      # Prepare combined deploy dir
      - name: Prepare deploy directory
        run: |
          mkdir -p ./public/docs
          mkdir -p ./public/web-demos
          cp -r ./site/* ./public/docs/
          cp -r ./web-demos/* ./public/web-demos/

      # Deploy to GitHub Pages (docs at /docs/, demos at /web-demos/)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public