name: Deploy Web Demos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install pygbag and ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag
          sudo apt-get update && sudo apt-get install -y ffmpeg


      - name: Build all demo projects for web
        run: |
          set -e
          mkdir -p $GITHUB_WORKSPACE/web-demos
          for d in $GITHUB_WORKSPACE/demo_projects/*; do
            if [ -f "$d/main.py" ]; then
              proj=$(basename "$d")
              echo "Building $proj..."
              # Always use the export script (required)
              uv run pygbag_export.py "$d" --build || true
              # Copy build output if exists
              if [ -d "$d/build/web" ]; then
                mkdir -p "$GITHUB_WORKSPACE/web-demos/$proj"
                cp -r "$d/build/web"/* "$GITHUB_WORKSPACE/web-demos/$proj/"
              elif [ -d "$d/_web_build/build/web" ]; then
                mkdir -p "$GITHUB_WORKSPACE/web-demos/$proj"
                cp -r "$d/_web_build/build/web"/* "$GITHUB_WORKSPACE/web-demos/$proj/"
              fi
            fi
          done


      # No need for a separate prepare step; handled above

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/web-demos
          force_orphan: true
