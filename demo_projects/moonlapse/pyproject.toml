[project]
name = "moonlapse"
version = "0.1.0"
description = "Moonlapse multiplayer chat demo."
requires-python = ">=3.14"
dependencies = [
    "ajishio",
    "websockets>=16.0",
    "aiosqlite>=0.20.0",
]

[tool.uv.sources]
ajishio = { path = "../../../ajishio", editable = true }

[tool.setuptools.packages]
find = { include = ["moonlapse*"] }

[dependency-groups]
dev = [
    "sqlc-bin>=1.0.0",
]
