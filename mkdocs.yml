site_name: Ajishio
site_description: A stripped-down pygame-based 2D game engine for rapid, unserious game development
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_api_ref.py
  - mkdocstrings:
      handlers:
        python:
          paths: [ajishio/src]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Guide:
      - VS Code & Static Analysis: vs-code.md
      - Loading Rooms: rooms.md
      - Sprites & Collision: sprites.md
      - Profiling: profiling.md
      - Web Export: web-export.md
      - Networking Internals:
        - Overview: net/index.md
        - What pygbag Actually Does: net/01-what-pygbag-actually-does.md
        - The Browser Runtime Environment: net/02-the-browser-runtime-environment.md
        - The aio Module: net/03-the-aio-module.md
        - The js Module: net/04-the-js-module.md
        - The aio.cross Module: net/05-the-aio-cross-module.md
        - Simulator vs Real Browser: net/06-the-simulator-vs-real-browser.md
        - Networking Strategies: net/07-networking-strategies.md
        - The +20000 Port Mapping: net/08-the-20000-port-mapping.md
        - Type Checking Across Platforms: net/09-type-checking-across-platforms.md
        - The Stub Files: net/10-the-stub-files.md
        - The Dual-Field Transport Design: net/11-the-dual-field-transport-design.md
        - Platform Abstraction Helpers: net/12-platform-abstraction-helpers.md
        - The GameNetClient API and packets.py: net/13-the-gameclient-api-and-packets-py.md
