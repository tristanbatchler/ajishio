site_name: Ajishio
site_description: A stripped-down pygame-based 2D game engine for rapid, unserious game development
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_api_ref.py
  - mkdocstrings:
      handlers:
        python:
          paths: [ajishio/src]
          options:
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            docstring_style: google
            members_order: source
            filters: ["!^_"]

nav:
  - Home: index.md
  - Guide:
      - VS Code & Static Analysis: vs-code.md
      - Loading Rooms: rooms.md
      - Sprites & Collision: sprites.md
      - Profiling: profiling.md
      - Web Export: web-export.md
  - API Reference: api.md   # This file is generated automatically
  - Contributing: contributing.md