[project]
name = "ajishio-workspace"
version = "0.1.0"
description = "Workspace for the Ajishio 2D game engine and demo projects."
requires-python = ">=3.14"
dependencies = [
    "ajishio",
]

[tool.uv.workspace]
members = [
    "demo_projects",
]

[tool.uv.sources]
ajishio = { path = "./ajishio", editable = true }

[dependency-groups]
dev = [
    "snakeviz>=2.2.2",
]